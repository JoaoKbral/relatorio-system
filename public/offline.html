<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <title>Sem internet — Relatório de Culto</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f9fafb; color: #111827; }
    main { max-width: 22rem; margin: 1rem; padding: 1.5rem; background: #fff; border-radius: 1rem;
           box-shadow: 0 1px 3px rgba(0,0,0,.1); text-align: center; }
    h1 { font-size: 1.15rem; margin: .5rem 0; }
    p { color: #4b5563; font-size: .95rem; line-height: 1.4; }
    a { display: block; margin-top: .6rem; padding: .7rem; border-radius: .5rem; text-decoration: none; font-weight: 600; }
    .primary { background: #1d4ed8; color: #fff; }
    .secondary { border: 1px solid #d1d5db; color: #1f2937; }
  </style>
</head>
<body>
  <main>
    <h1>Você está sem internet</h1>
    <p>Esta página não está disponível offline. Você ainda pode preencher um relatório: ele fica salvo no aparelho e é enviado quando a internet voltar.</p>
    <a class="primary" href="/culto/novo">Novo relatório</a>
    <a class="secondary" href="/pendentes">Relatórios pendentes</a>
    <a class="secondary" href="/">Início</a>
  </main>
</body>
</html>
